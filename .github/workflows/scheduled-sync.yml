name: Scheduled Sync

on:
  schedule:
    - cron: "0 9 * * *"   # Nightly sync - 4 AM EST (9 AM UTC)
    - cron: "0 10 * * 0"  # Weekly bio sync - Sundays 5 AM EST (10 AM UTC)
  workflow_dispatch:       # Allow manual trigger

jobs:
  nightly-sync:
    name: Nightly Data Sync
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * *'
    steps:
      - name: Trigger nightly sync
        run: |
          curl -sf -X POST https://benchwarmer-api.fly.dev/api/admin/sync \
            -H "X-Api-Key: ${{ secrets.API_KEY }}"

  weekly-bio-sync:
    name: Weekly Bio Sync
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 10 * * 0'
    steps:
      - name: Trigger bio sync
        run: |
          curl -sf -X POST https://benchwarmer-api.fly.dev/api/admin/sync-bios \
            -H "X-Api-Key: ${{ secrets.API_KEY }}"
